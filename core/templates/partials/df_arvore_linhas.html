{% for l in linhas %}
<tr class="dfa-row dfa-row--{{ l.tipo_linha }}">
  <td style="padding-left: {{ l.nivel|add:'-1' }}rem;"><span class="dfa-cod">{{ l.codigo }}</span> {{ l.descricao }}</td>
  <td class="dfa-num{% if l.atual < 0 %} dfa-neg{% endif %}">{{ l.atual|floatformat:"0g" }}</td>
  <td class="dfa-pct">{% if l.perc_atual is not None %}{{ l.perc_atual|floatformat:1 }}%{% endif %}</td>
  <td class="dfa-num{% if l.anterior < 0 %} dfa-neg{% endif %}">{{ l.anterior|floatformat:"0g" }}</td>
  <td class="dfa-pct">{% if l.perc_anterior is not None %}{{ l.perc_anterior|floatformat:1 }}%{% endif %}</td>
</tr>
{% endfor %}
