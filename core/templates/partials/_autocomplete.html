{# Autocomplete genérico. Uso: autocomplete({ input, hidden, url, params, resultsKey, label(item), render(item, li), isDisabled(item), emptyText, onSelect(item) }) #}
<style>
  .ca-wrap { position: relative; }
  .ca-list { position: absolute; z-index: 1056; left: 0; right: 0; top: 100%; max-height: 16rem; overflow-y: auto;
    margin: .15rem 0 0; padding: .25rem; list-style: none; border-radius: 10px;
    background: var(--surface-2); border: 1px solid var(--border-color); box-shadow: var(--shadow-card-hover, 0 8px 24px rgba(0,0,0,.25)); }
  .ca-list[hidden] { display: none; }
  .ca-item { padding: .4rem .6rem; border-radius: 6px; cursor: pointer; font-size: .85rem; color: var(--text-secondary); }
  .ca-item.is-active:not(.is-disabled), .ca-item:hover:not(.is-disabled) { background: var(--surface-3); color: var(--text-primary); }
  .ca-item.is-disabled { opacity: .5; cursor: not-allowed; }
  .ca-item b { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: var(--text-primary); margin-right: .4rem; }
  .ca-item small { color: var(--text-muted); margin-left: .4rem; }
  .ca-vazio { padding: .5rem .6rem; font-size: .82rem; color: var(--text-muted); }
</style>
<script>
window.autocomplete = function (opts) {
  const input = opts.input, hidden = opts.hidden;
  const lista = document.createElement("ul");
  lista.className = "ca-list";
  lista.hidden = true;
  input.parentNode.appendChild(lista);
  let itens = [], ativo = -1, timer = null, seq = 0;

  function fechar() { lista.hidden = true; ativo = -1; }
  function marcar(i) {
    ativo = i;
    Array.prototype.forEach.call(lista.children, function (li, j) { li.classList.toggle("is-active", j === i); });
  }
  function escolher(item) {
    if (opts.isDisabled && opts.isDisabled(item)) return;
    input.value = opts.label(item);
    hidden.value = item.id;
    input.setCustomValidity("");
    fechar();
    if (opts.onSelect) opts.onSelect(item);
  }
  function desenhar() {
    lista.innerHTML = "";
    if (!itens.length) {
      const v = document.createElement("li");
      v.className = "ca-vazio";
      v.textContent = opts.emptyText || "Nenhum resultado.";
      lista.appendChild(v);
    }
    itens.forEach(function (item) {
      const li = document.createElement("li");
      li.className = "ca-item" + (opts.isDisabled && opts.isDisabled(item) ? " is-disabled" : "");
      opts.render(item, li);
      li.addEventListener("mousedown", function (e) { e.preventDefault(); escolher(item); });
      lista.appendChild(li);
    });
    lista.hidden = false;
    const primeiro = itens.findIndex(function (item) { return !(opts.isDisabled && opts.isDisabled(item)); });
    marcar(primeiro);
  }
  function buscar() {
    const minha = ++seq;
    const p = new URLSearchParams(opts.params || {});
    p.set("q", input.value.trim());
    fetch(opts.url + "?" + p.toString(), { headers: { "X-Requested-With": "XMLHttpRequest" } })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (minha !== seq) return;  // resposta antiga
        itens = j[opts.resultsKey] || [];
        desenhar();
      });
  }

  input.addEventListener("input", function () {
    hidden.value = "";  // texto mudou: a escolha anterior deixa de valer
    clearTimeout(timer);
    timer = setTimeout(buscar, 180);
  });
  input.addEventListener("focus", function () { if (!hidden.value) buscar(); });
  input.addEventListener("blur", function () { setTimeout(fechar, 120); });
  input.addEventListener("keydown", function (e) {
    if (lista.hidden) return;
    if (e.key === "ArrowDown") { e.preventDefault(); marcar(Math.min(ativo + 1, itens.length - 1)); }
    else if (e.key === "ArrowUp") { e.preventDefault(); marcar(Math.max(ativo - 1, 0)); }
    else if (e.key === "Enter" && ativo >= 0) { e.preventDefault(); escolher(itens[ativo]); }
    else if (e.key === "Escape") { fechar(); }
  });

  return {
    definir: function (item) { item ? escolher(item) : (input.value = "", hidden.value = ""); },
    limpar: function () { input.value = ""; hidden.value = ""; fechar(); }
  };
};
</script>
