{# Autocomplete de conta do plano (invólucro do autocomplete genérico). Uso: contaAutocomplete({ input, hidden, url, patrimonial }) #}
{% include 'partials/_autocomplete.html' %}
<script>
window.contaAutocomplete = function (opts) {
  return window.autocomplete({
    input: opts.input, hidden: opts.hidden, url: opts.url,
    params: opts.patrimonial ? { patrimonial: 1 } : {},
    resultsKey: "contas",
    emptyText: "Nenhuma conta analítica encontrada.",
    label: function (c) { return c.codigo + " — " + c.descricao; },
    render: function (c, li) {
      const b = document.createElement("b"); b.textContent = c.codigo;
      const t = document.createElement("span"); t.textContent = c.descricao;
      const s = document.createElement("small"); s.textContent = c.natureza;
      li.appendChild(b); li.appendChild(t); li.appendChild(s);
    },
    onSelect: opts.onSelect
  });
};
</script>
